<!DOCTYPE html>

<body class="no-wish">

        <span class="logo__text">All<b>At</b>Once</span>

      <form class="search" id="searchForm" role="search">

            <p class="auth-menu__hello">Hola, <strong id="authName"></strong></p>

        <a class="action" href="favoritos.html" aria-label="Favoritos">

    <span id="toastMsg"></span>
